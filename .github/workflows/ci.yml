name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Unit tests (race)
        run: go test -race ./...

      - name: Fetch the General Decimal Arithmetic conformance suite
        run: make testdata

      - name: Conformance suite (all ~65k cases, 0 skips expected)
        run: cd dectest && DECTEST_DIR=testdata/suite go test -run TestSuite -v

      - name: Fuzz smoke test
        run: go test -run=- -fuzz=FuzzAddMulExact -fuzztime=30s .
